[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "mock-adapter"
version = "0.1.0"
description = "Base class for external calculators and mock calculator"
readme = "README.md"
requires-python = ">=3.9"
license = "BSD-3-Clause"
license-files = ["LICENSE"]

authors = [
    {name = "Martin Lang"},
    {name = "Samuel Holt"},
    {name = "Marijan Beg"},
    {name = "Swapneel Amit Pathak"},
    {name = "Hans Fangohr"}
]

classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Education",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: Unix",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Visualization"
]

dependencies = [
    "discretisedfield",
    "micromagneticdata",
    "micromagneticmodel>=0.64.0",
    "ubermagtable",
]

[project.optional-dependencies]
dev = [
    "build",
    "invoke",
    "nbval",
    "pre-commit",
    "pytest-cov",
    "twine",
    "tomli; python_version < '3.11'",
]

[project.urls]
homepage = "https://ubermag.github.io"
documentation = "https://ubermag.github.io/documentation/mock_adapter"
repository = "https://github.com/ubermag/mock_adapter"

[project.entry-points."micromagneticdata.plugins.CalculatorDrive"]
mock_adapter = "mock_adapter.plugins.mock_drive:MockCalculatorDrive"
[project.entry-points."micromagneticdata.plugins.read_table"]
mock_adapter = "mock_adapter.plugins.read_table:table_from_file"


[tool.coverage.run]
omit = ["mock_adapter/tests/*"]

[tool.ruff.lint]
select = [
    "B",   # flake8-bugbear
    "E",   # pycodestyle
    "F",   # Pyflakes
    "I",   # isort
    "SIM", # flake8-simplify
    "UP",  # pyupgrade
]
ignore = [
    # conflict with other rules
    "D203",  # one-blank-line-before-class (conflicts with D204)
    "D212",  # multi-line-summary-first-line (conflicts with D213)
    # conflict with formatter
    "D206",  # indent-with-spaces
    "D300",  # triple-single-quotes
    "E111",  # indentation-with-invalid-multiple
    "E114",  # indentation-with-invalid-multiple-comment
    "E117",  # over-indented
    # conflict with Python 3.6 compatibility
    "UP022", # replace-stdout-stderr
]

[tool.ruff.lint.isort]
known-local-folder = ["mock_adapter"]

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = [
    "B018",  # "Found useless expression. Either assign it to a variable or remove it."; false positives when using implicit __repr__ in the notebook
    "E501",  # line too long
    "F811",  # 'redefined-while-unused'; many false positives in notebooks because ipywidgets decorated functions are not recognised
]

[tool.pytest.ini_options]
filterwarnings = [
    "error",
    "ignore:((.|\n)*)Sentinel is not a public part of the traitlets API((.|\n)*)",  # dependency of k3d
]

#[tool.setuptools.packages.find]
#include = ["mock_adapter"]

# to define additional information we use a custom table
# see: https://www.python.org/dev/peps/pep-0518/#tool-table
[tool.ubermag]
doi = "10.5281/zenodo.3539479"
copyright_holder = "Ubermag developers"
contributors = [
]
about = """
- Base classes for external calculator packages. Adapter packages must subclass these.

- Mock calculator to (i) demonstrate how to write an adapter package, (ii) provide fake test data.

"""
